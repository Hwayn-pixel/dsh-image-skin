name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-half:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed, so `npm install` rather than `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Host half test suite
        run: npm test
